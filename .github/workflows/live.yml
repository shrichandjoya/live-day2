name: 24/7 Infinite Auto-Relaunch Bypass

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Pipeline
      uses: actions/checkout@v3

    - name: Load Network Media Encoder
      run: |
        sudo apt-get update -y
        sudo apt-get install -y ffmpeg curl
        
    - name: Auto-Inject Infinite Live Loop
      run: |
        echo "Processing uploaded repository files... Running your own track."
        while true; do
          ffmpeg -re -loop 1 -i "$GITHUB_WORKSPACE/background.jpg.jpg" -i "$GITHUB_WORKSPACE/musicmp3.mp4" -c:v libx264 -preset ultrafast -tune stillimage -b:v 1000k -maxrate 1000k -bufsize 2000k -g 30 -c:a aac -b:a 96k -ar 44100 -f flv "rtmp://://youtube.com"
          echo "Stream connection blinked? Re-injecting packets in 2 seconds..."
          sleep 2
        done
